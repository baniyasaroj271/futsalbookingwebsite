{% extends "base.html" %}
{% block title %}Edit {{ venue.name }} · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card venue-edit-card"><p class="eyebrow">VENUE MANAGEMENT</p><h1>Edit venue details</h1><p class="muted">Update information and publish a temporary closure for your pitch.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Venue name<input name="name" value="{{ venue.name }}" required maxlength="160"></label><label>Address<input name="address" value="{{ venue.address }}" required></label><label>Description<textarea name="description" required>{{ venue.description }}</textarea></label><div class="form-two"><label>Hourly price<input type="number" name="price_per_hour" min="0" value="{{ venue.price_per_hour }}" required></label><label>Available slots<input type="number" name="available_slots" min="0" value="{{ venue.available_slots }}" required></label></div><div class="form-two"><label>Opening time<input type="time" name="open_time" value="{{ venue.open_time }}" required></label><label>Closing time<input type="time" name="close_time" value="{{ venue.close_time }}" required></label></div><label class="checkbox-label"><input type="checkbox" name="is_open" {% if venue.is_open %}checked{% endif %}> Venue is operating</label><h3>Temporary closure or holiday</h3><div class="form-two"><label>Date<input type="date" name="closure_date" min="{{ now_date }}"></label><label>Reason<input name="closure_reason" placeholder="Public holiday, maintenance"></label></div><button class="button button-full" type="submit">Save venue schedule</button></form></div></main>{% endblock %}
