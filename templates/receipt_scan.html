{% extends "base.html" %}
{% block title %}Receipt scan · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card venue-edit-card"><p class="eyebrow">OPTIONAL OCR</p><h1>Receipt details</h1><p class="muted">Review and edit extracted values. OCR is not proof of payment.</p>{% if upload %}<p class="ocr-note">{{ upload }}</p>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="stored_filename" value="{{ stored_filename|default('') }}"><input type="hidden" name="original_filename" value="{{ original_filename|default('') }}"><label>Merchant name<input name="merchant_name" value="{{ extracted.merchant_name|default('') }}"></label><label>Transaction date<input name="transaction_date" value="{{ extracted.transaction_date|default('') }}"></label><label>Amount<input name="amount" value="{{ extracted.amount|default('') }}"></label><label>Transaction reference<input name="transaction_reference" value="{{ extracted.transaction_reference|default('') }}"></label><button class="button button-full" type="submit">Save receipt details</button></form>{% if not extracted %}<hr><form method="post" enctype="multipart/form-data" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Receipt image<input type="file" name="receipt" accept=".png,.jpg,.jpeg,.webp" required></label><button class="button button-full" type="submit">Scan receipt</button></form>{% endif %}</div></main>{% endblock %}
