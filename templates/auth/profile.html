{% extends "base.html" %}
{% block title %}Your profile · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card"><p class="eyebrow">YOUR ACCOUNT</p><h1>Profile details</h1><p class="muted">Keep your contact details up to date for booking updates.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input type="text" name="name" value="{{ profile_user.name }}" required maxlength="120"></label><label>Email address<input type="email" value="{{ profile_user.email }}" disabled></label><label>Phone number<input type="tel" name="phone" value="{{ profile_user.phone }}" required></label><p class="muted">Account role: <strong>{{ profile_user.role|capitalize }}</strong></p><button class="button button-full" type="submit">Save changes</button></form></div></main>{% endblock %}
