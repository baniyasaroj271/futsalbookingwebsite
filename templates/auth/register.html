{% extends "base.html" %}{% block title %}Create account · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Make every game count.</h1><p class="muted">Create your free account and start booking Nepal's best pitches.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input type="text" name="name" required autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Phone number<input type="tel" name="phone" required autocomplete="tel"></label><label>Password <small>(8+ characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button button-full" type="submit">Create account</button></form><p class="form-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></main>{% endblock %}
