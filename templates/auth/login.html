{% extends "base.html" %}{% block title %}Log in · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Ready for your next game?</h1><p class="muted">Log in to manage your bookings and discover more pitches.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-full" type="submit">Log in</button></form><p class="form-foot">New to FutsalHub? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></main>{% endblock %}
