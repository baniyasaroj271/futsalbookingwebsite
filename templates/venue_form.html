{% extends "base.html" %}{% block title %}Register venue · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card venue-edit-card"><p class="eyebrow">OWNER PORTAL</p><h1>Register a futsal</h1><p class="muted">Your venue will be reviewed by an administrator before it can accept bookings.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Venue name<input name="name" required></label><div class="form-two"><label>Location<input name="location" required></label><label>Address<input name="address" required></label></div><label>Description<textarea name="description" required></textarea></label><label>Photo URL<input type="url" name="image_url" required></label><label>Facilities<input name="amenities" placeholder="Parking, Changing rooms"></label><div class="form-two"><label>Latitude<input type="number" name="latitude" step="any" required></label><label>Longitude<input type="number" name="longitude" step="any" required></label></div><div class="form-two"><label>Hourly price<input type="number" name="price_per_hour" min="0" required></label><label>Available slots<input type="number" name="available_slots" min="0" required></label></div><div class="form-two"><label>Opening time<input type="time" name="open_time" required></label><label>Closing time<input type="time" name="close_time" required></label></div><button class="button button-full" type="submit">Submit for approval</button></form></div></main>{% endblock %}
