{% extends "base.html" %}
{% block title %}Publish announcement · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card venue-edit-card"><p class="eyebrow">COMMUNITY NEWS</p><h1>Publish announcement</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required></label><label>Category<select name="category"><option>Platform update</option><option>Discount</option><option>Venue closure</option><option>Tournament</option><option>Booking</option></select></label><label>Venue scope<select name="venue_id"><option value="">Platform-wide</option>{% for venue in venues %}<option value="{{ venue.id }}">{{ venue.name }}</option>{% endfor %}</select></label><label>Message<textarea name="body" required></textarea></label><label>Expiry date<input type="date" name="expires_at"></label><button class="button button-full" type="submit">Publish announcement</button></form></div></main>{% endblock %}
