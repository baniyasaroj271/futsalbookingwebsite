{% extends "base.html" %}
{% block title %}Create tournament · FutsalHub Nepal{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card venue-edit-card"><p class="eyebrow">EVENT MANAGEMENT</p><h1>Create tournament</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Tournament name<input name="name" required></label><label>Venue<input name="venue_name" required></label><div class="form-two"><label>Tournament date<input type="date" name="tournament_date" required></label><label>Registration deadline<input type="date" name="registration_deadline" required></label></div><div class="form-two"><label>Entry fee<input type="number" name="entry_fee" min="0" required></label><label>Team capacity<input type="number" name="team_limit" min="1" required></label></div><label>Prize pool<input name="prize" required></label><label>Rules<textarea name="rules" required></textarea></label><button class="button button-full" type="submit">Publish tournament</button></form></div></main>{% endblock %}
